name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-latest
            cc: gcc
            cxx: g++
          - name: linux-clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++
          - name: macos-clang
            os: macos-latest
            cc: clang
            cxx: clang++
          - name: windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: lukka/get-cmake@latest

      - name: MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DBOOKREPLAY_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # A decoder that reads attacker-shaped bytes earns a sanitizer run. The
  # malformed-input tests are only evidence if something is watching the reads
  # they provoke.
  sanitizers:
    name: asan+ubsan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          ASAN_OPTIONS: detect_leaks=1
        run: ctest --test-dir build --output-on-failure

  # First differential oracle: Databento's reference decoder, via its Python
  # bindings, field by field over every v3 fixture.
  oracle-python:
    name: oracle (databento-dbn)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned to the same release the fixtures in tests/data came from.
      - run: pip install "databento-dbn==0.66.0" zstandard

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build --target dbn_dump

      - name: Diff every v3 fixture against the oracle
        run: >
          python tools/oracle_diff.py --dump build/tools/dbn_dump
          tests/data/*.v3.dbn.zst tests/data/test_data.mbo.v3.dbn

  # Second differential oracle: databento-cpp, an independent C++
  # implementation, compared byte for byte rather than field by field.
  oracle-cpp:
    name: oracle (databento-cpp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libzstd-dev

      # Pinned. An oracle that drifts is not an oracle.
      # Ninja, not Make: under Make a bare --parallel is `make -j` with no
      # limit, which starts every translation unit at once and gets the step
      # killed on a four-core runner.
      - name: Build and install databento-cpp
        run: |
          git clone --depth 1 --branch v0.64.0 https://github.com/databento/databento-cpp.git ${{ runner.temp }}/databento-cpp
          cmake -S ${{ runner.temp }}/databento-cpp -B ${{ runner.temp }}/databento-cpp/build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DDATABENTO_ENABLE_UNIT_TESTING=OFF \
            -DDATABENTO_ENABLE_EXAMPLES=OFF
          cmake --build ${{ runner.temp }}/databento-cpp/build --target databento
          sudo cmake --install ${{ runner.temp }}/databento-cpp/build

      # Both sides must link the same zstd, or one binary carries two copies.
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DBOOKREPLAY_BUILD_ORACLE=ON
          -DBOOKREPLAY_USE_SYSTEM_ZSTD=ON

      - name: Build
        run: cmake --build build --target oracle_diff

      - name: Diff every v3 fixture against the oracle
        run: >
          ./build/tests/oracle/oracle_diff
          tests/data/*.v3.dbn.zst tests/data/test_data.mbo.v3.dbn

  # Windows is in the matrix because the module is the only target that needs
  # /external: to keep -Werror off pybind11's headers, and nothing else here
  # would catch that flag rotting.
  python:
    name: pybind11 module (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: windows
            os: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - run: pip install pytest

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DBOOKREPLAY_BUILD_PYTHON=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build -L python --output-on-failure

  # Builds the benchmarks and runs each case for one iteration on the
  # synthetic stream, so they cannot rot. Nothing here is timed against a
  # threshold: a shared runner's clock would make any threshold noise. The one
  # performance claim CI can check, that the fast book stops allocating once it
  # has held its most, is a unit test in the suite above.
  benchmarks:
    name: benchmarks (synthetic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DBOOKREPLAY_BUILD_TESTS=OFF
          -DBOOKREPLAY_BUILD_BENCHMARKS=ON

      - name: Build
        run: cmake --build build --target bookreplay_benchmarks

      - name: Run
        run: ./build/benchmarks/bookreplay_benchmarks --benchmark_min_time=1x

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned. An unpinned formatter drifts between the runner and the
      # developer's machine and produces diffs nobody wrote.
      - run: pip install clang-format==22.1.3
      - name: Check formatting
        run: |
          files=$(git ls-files '*.cpp' '*.hpp')
          echo "$files"
          clang-format --dry-run --Werror $files
